[package]
name = "bnkfiles"
version = "0.1.0"
edition = "2021"

[dependencies]
# The image decoders are the only external dependencies.
zune-core = { version = "0.5", default-features = false, features = ["std"] }
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
zune-png = { version = "0.5", default-features = false, features = ["std"] }
gif = "0.14"
image-webp = "0.2"

[features]
perf-alloc = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
